<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
    <a-assets>
        <img id="sun"     src="../assets/images/sun.jpg">
        <img id="mercury" src="../assets/images/mercury.jpg">
        <img id="venus"   src="../assets/images/venus.png">
        <img id="earth"   src="../assets/images/earth.jpg">
        <img id="moon"    src="../assets/images/moon.jpg">
        <img id="mars"    src="../assets/images/mars.jpg">
        <img id="jupiter" src="../assets/images/jupter.png">
        <img id="saturn"  src="../assets/images/saturn.png">
        <img id="uranus"  src="../assets/images/uranus.jpg">
        <img id="neptune" src="../assets/images/neptune.jpg">
        <img id="pluto"   src="../assets/images/pluto.jpg">
    </a-assets>
    <a-sky color="#020617"></a-sky>
    <a-sphere
        position="0 0 0"
        radius="2"
        material="src: #sun; shader: flat"
        animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            easing: linear;
            dur: 20000">
    </a-sphere>
    <a-light
        type="point"
        position="0 0 0
        intensity="2"
        distance="50">
    </a-light>
    <a-ring

        material="

            color: #555;

    <a-ring
        radius-inner="4.45"

    <a-ring
        radius-inner="7.45"

            shader: flat;
            color: #555;

            transparent: true">
    </a-ring>
    <a-ring
        radius-inner="9.95"

    <a-ring
        radius-inner="12.95"

        rotation="-90 0 0"
        material="
            shader: flat;
            color: #555;
            opacity: 0.5;
            transparent: true">
    </a-ring>
    <a-ring
        radius-inner="15.95"
        radius-outer="16.02"

        material="
            shader: flat;
            color: #555;
            opacity: 0.5;
            transparent: true">
    </a-ring>
    <a-ring
        radius-inner="18.95"

        material="

    <a-ring

    <a-entity

            position="6 0 0"

    <a-entity

        animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            easing: linear;

    <a-entity

            to: 0 360 0;

            <a-sphere
                radius="0.9"

            </a-sphere>
            <a-ring
                radius-inner="1.1"
                radius-outer="1.7"

                color="#C8A66A">

        </a-entity>

    </a-entity>
    <a-entity
        position="0 0 0"
        animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            easing: linear;
            dur: 28000">

        <a-sphere
            position="16 0 0"
            radius="0.65"
            material="src: #uranus; shader: flat">
        </a-sphere>

    </a-entity>
    <a-entity
        position="0 0 0"
        animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            easing: linear;
            dur: 33000">

        <a-sphere
            position="19 0 0"
            radius="0.6"
            material="src: #neptune; shader: flat">

    <a-entity
        position="0 0 0"
        animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            easing: linear;
            dur: 40000">

        <a-sphere
            position="22 0 0"
            radius="0.3"
            material="src: #pluto; shader: flat">
        </a-sphere>

    </a-entity>
    <a-camera
        id="camera"
        position="0 15 30"
        rotation="-20 0 0"
        fov="70">
    </a-camera>


</a-scene>

// カメラ操作をAIに手伝ってもらいました 

<script>

    const camera = document.querySelector('#camera');

    window.addEventListener('wheel', function(event) {

        const pos = camera.getAttribute('position');

        /*
         * マウスホイール操作
         *
         * ホイール上
         * → カメラが下がる
         *
         * ホイール下
         * → カメラが上がる
         */

        pos.y += event.deltaY * 0.03;

        // カメラの高さを制限
        pos.y = Math.max(5, Math.min(60, pos.y));

        camera.setAttribute('position', pos);

    });

</script>

</body>
</html>
